services:
  api:
    container_name: life-planner-back
    build: .
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - '1009:3000'
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-staging}
      PORT: ${PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-0}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-0}
      FINANCE_MATERIALIZATION_GATE_TTL_MS: ${FINANCE_MATERIALIZATION_GATE_TTL_MS:-60000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-172800}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      PERF_COUNT_QUERIES: ${PERF_COUNT_QUERIES:-}
      VERSION_REPO_API: ${VERSION_REPO_API:-}
      VERSION_REPO_APP: ${VERSION_REPO_APP:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      FINNHUB_TOKEN: ${FINNHUB_TOKEN:-}
      INVESTMENT_QUOTES_JOB_ENABLED: ${INVESTMENT_QUOTES_JOB_ENABLED:-true}
      INVESTMENT_QUOTES_BRAPI_BATCH_SIZE: ${INVESTMENT_QUOTES_BRAPI_BATCH_SIZE:-20}
      INVESTMENT_QUOTE_REFRESH_COOLDOWN_MS: ${INVESTMENT_QUOTE_REFRESH_COOLDOWN_MS:-60000}
      VERSION_CHECK_TTL_SECONDS: ${VERSION_CHECK_TTL_SECONDS:-600}

    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
